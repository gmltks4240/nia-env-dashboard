# 주간 개발 일지 자동 생성
#
# 매주 월요일 아침(KST), 지난 한 주의 커밋·PR·이슈를 모아
# docs/activity/YYYY-Www.md 로 만들어 main 에 커밋한다.
# 아무 활동이 없던 주는 아무것도 만들지 않는다.
#
# 수동으로 돌리려면: Actions 탭 → journal → Run workflow
#
# main 에 PR 필수 규칙이 걸려 있어 Actions 가 main 에 직접 푸시할 수 없다
# (개인 저장소에서는 bypass 목록에 GitHub Actions 를 넣을 수 없다).
# 그래서 일지를 전용 브랜치에 올리고 PR 을 연다. 받아 보고 합치면 된다.

name: journal

on:
  schedule:
    - cron: '37 23 * * 0'      # 일요일 23:37 UTC = 월요일 08:37 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 지난 한 주 활동 모으기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          UNTIL=$(date -u +%Y-%m-%d)
          WEEK=$(date -u +%G-W%V)
          OUT="docs/activity/${WEEK}.md"
          mkdir -p docs/activity "$RUNNER_TEMP/j"

          gh pr list --repo "$REPO" --state merged --limit 50 \
            --json number,title,author,mergedAt,additions,deletions > "$RUNNER_TEMP/j/merged.json"
          gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,title,author,isDraft > "$RUNNER_TEMP/j/open.json"
          gh issue list --repo "$REPO" --state all --limit 50 \
            --json number,title,author,state,createdAt,closedAt > "$RUNNER_TEMP/j/issues.json"

          python3 tools/journal.py \
            --since "$SINCE" --until "$UNTIL" --week "$WEEK" --repo "$REPO" \
            --merged "$RUNNER_TEMP/j/merged.json" \
            --open   "$RUNNER_TEMP/j/open.json" \
            --issues "$RUNNER_TEMP/j/issues.json" > "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"

      - name: 활동이 있었는지 확인
        id: check
        run: |
          set -euo pipefail
          if grep -qE '^- ' "$OUT"; then
            echo "has_activity=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_activity=false" >> "$GITHUB_OUTPUT"
            rm -f "$OUT"
            echo "이번 주 활동 없음 — 일지를 만들지 않습니다."
          fi

      - name: 브랜치에 올리고 PR 열기
        if: steps.check.outputs.has_activity == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          BR="docs/journal-${WEEK}"
          git checkout -B "$BR"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "달라진 내용 없음 — 올리지 않습니다"
            exit 0
          fi
          git commit -m "${WEEK} 개발 일지 자동 생성"
          git push -f origin "$BR"

          # 같은 주의 PR 이 이미 열려 있으면 커밋만 더하고 끝낸다
          if gh pr list --repo "$REPO" --head "$BR" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "이미 열려 있는 PR 에 반영했습니다"
            exit 0
          fi
          gh pr create --repo "$REPO" --base main --head "$BR" \
            --title "${WEEK} 개발 일지" \
            --body "$(printf '%s\n' \
              "지난 한 주의 커밋·PR·이슈·기여자를 모아 \`${OUT}\` 에 담았습니다." \
              "" \
              "\`.github/workflows/journal.yml\` 이 매주 월요일 아침에 자동으로 만듭니다." \
              "" \
              "**합치기 전에 한 주를 돌아보며 한두 문단 덧붙여 주세요.**" \
              "자동 생성된 것은 '무슨 일이 있었나'까지만 말해 줍니다." \
              "무엇이 어려웠고 무엇을 배웠는지는 사람만 쓸 수 있습니다." \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"
