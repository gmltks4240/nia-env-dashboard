# 자동 테스트 — PR 을 올리거나 main 에 합칠 때마다 tests/run_all.py 를 돌린다.
# 실패하면 PR 화면에 빨간 ✗ 가 뜬다. (합치기를 막으려면 저장소 Settings → Rules 에서
# 이 검사 'tests' 를 필수로 지정)
#
# Supabase·날씨·글꼴 요청은 테스트가 가로채서 가짜로 답하므로 비밀값이 필요 없다.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 버전을 고정해야 브라우저 빌드가 매번 같다 (로컬 확인: playwright 1.65.1)
      - name: Playwright 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.65.1
          python -m playwright install --with-deps chromium

      - name: 테스트
        run: python tests/run_all.py
