# 자동 테스트 — PR 을 올리거나 main 에 합칠 때마다 tests/run_all.py 를 돌린다.
# 실패하면 PR 화면에 빨간 ✗ 가 뜬다. (합치기를 막으려면 저장소 Settings → Rules 에서
# 이 검사 'tests' 를 필수로 지정)
#
# Supabase·날씨·글꼴 요청은 테스트가 가로채서 가짜로 답하므로 비밀값이 필요 없다.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright 공식 컨테이너: Chromium 과 한글 글꼴(wqy-zenhei)이 미리 들어 있어
    # 돌 때마다 우분투 패키지 서버에서 받지 않는다 (서버가 503 이면 테스트 전에 실패하던 것).
    # 태그의 버전은 아래 pip 의 playwright 버전과 같아야 브라우저 빌드가 맞는다.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Playwright 설치 (브라우저는 컨테이너에 있음)
        run: python -m pip install playwright==1.65.1

      - name: 테스트
        run: python tests/run_all.py
